name: Build rtw88 for OpenWrt 25.12.6 (rockchip/armv8)

on:
  workflow_dispatch:

env:
  OWRT_VERSION: "25.12.6"
  OWRT_TARGET: "rockchip/armv8"
  SDK_PATTERN: "openwrt-sdk-25.12.6-rockchip-armv8_gcc-[^\"]*Linux-x86_64\\.tar\\.zst"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download and verify SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${OWRT_TARGET}"
          SDK=$(wget -qO- "$BASE/" | grep -oE "$SDK_PATTERN" | head -n1)
          [ -n "$SDK" ] || { echo "SDK file not found at $BASE"; exit 1; }
          echo "SDK: $SDK"
          wget -q "$BASE/$SDK"
          wget -q "$BASE/sha256sums"
          grep " \*\?$SDK\$" sha256sums | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK" -C sdk --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fetch rtw88-openwrt and keep only the 25.12 patch
        working-directory: sdk
        run: |
          git clone https://github.com/LuisMitaHL/rtw88-openwrt package/kernel/rtw88-backports
          cd package/kernel/rtw88-backports
          echo "Patches before:"; ls -1 patches
          for f in patches/*; do
            case "$f" in
              *25*) ;;
              *) rm -f "$f" ;;
            esac
          done
          echo "Patches kept:"; ls -1 patches
          [ -n "$(ls -A patches)" ] || { echo "No 25.12 patch left, check filenames"; exit 1; }

      - name: Build
        working-directory: sdk
        run: |
          make defconfig
          make package/rtw88-backports/compile -j"$(nproc)" V=s

      - name: Collect packages
        working-directory: sdk
        run: |
          mkdir -p ../out
          find bin -name "*rtw88*" -type f -exec cp -v {} ../out/ \;
          ls -l ../out
          [ -n "$(ls -A ../out)" ] || { echo "No packages produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rtw88-openwrt-${{ env.OWRT_VERSION }}-rockchip-armv8
          path: out/*
