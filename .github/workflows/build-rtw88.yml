name: Build rtw88 for OpenWrt (rockchip/armv8)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version, must match the router (cat /etc/openwrt_release)"
        default: "25.12.6"
        required: true
      rtw88_ref:
        description: "rtw88-openwrt branch/tag/commit (main = latest)"
        default: "main"
        required: true

env:
  OWRT_VERSION: ${{ inputs.openwrt_version }}
  RTW88_REF: ${{ inputs.rtw88_ref }}
  OWRT_TARGET: "rockchip/armv8"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget zstd

      - name: Download and verify SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${OWRT_TARGET}"
          PATTERN="openwrt-sdk-${OWRT_VERSION}-rockchip-armv8_gcc-[^\"]*Linux-x86_64\.tar\.zst"
          SDK=$(wget -qO- "$BASE/" | grep -oE "$PATTERN" | head -n1)
          [ -n "$SDK" ] || { echo "SDK file not found at $BASE"; exit 1; }
          echo "SDK: $SDK"
          wget -q "$BASE/$SDK"
          wget -q "$BASE/sha256sums"
          grep " \*\?$SDK\$" sha256sums | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK" -C sdk --strip-components=1

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a

      - name: Fetch rtw88-openwrt and keep only the matching patch
        working-directory: sdk
        run: |
          git clone https://github.com/LuisMitaHL/rtw88-openwrt package/kernel/rtw88-backports
          cd package/kernel/rtw88-backports
          git checkout "$RTW88_REF"
          echo "Using commit: $(git rev-parse HEAD)"
          SERIES="${OWRT_VERSION%.*}"   # 25.12.6 -> 25.12
          echo "Patches before:"; ls -1 patches
          # keep every numbered patch; drop only compat patches of other OpenWrt versions
          for f in patches/999-openwrt-*-compat.patch; do
            case "$f" in
              *"openwrt-${SERIES}-compat.patch") ;;
              *) rm -f "$f" ;;
            esac
          done
          echo "Patches kept:"; ls -1 patches
          # placeholder "index 0000000..0000000" makes GNU patch think the file is
          # created and deleted at once; drop those lines
          sed -i '/^index 0\{7,\}\.\.0\{7,\}/d' patches/*.patch
          grep -c '^index 0000000..0000000' patches/*.patch || true
          ls patches/999-openwrt-${SERIES}-compat.patch \
            || { echo "No compat patch for ${SERIES}"; exit 1; }

      - name: Build
        working-directory: sdk
        run: |
          make defconfig
          make package/rtw88-backports/compile -j"$(nproc)" V=s

      - name: Collect packages
        working-directory: sdk
        run: |
          mkdir -p ../out
          find bin -name "*rtw88*" -type f -exec cp -v {} ../out/ \;
          ls -l ../out
          [ -n "$(ls -A ../out)" ] || { echo "No packages produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rtw88-openwrt-${{ env.OWRT_VERSION }}-rockchip-armv8
          path: out/*
